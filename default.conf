server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # The specs are regenerated on every release — keep caches short so a fresh
    # deploy is reflected quickly (the k8s liveness/readiness probes hit "/").
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=300";
    }

    # Long-cache the immutable, version-pinned Swagger UI assets.
    location ~* \.(js|css|png|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
